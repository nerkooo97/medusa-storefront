services:
  storefront:
    build:
      context: .
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-http://medusajs-backend.77.42.72.66.nip.io}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-pk_test}
        NEXT_PUBLIC_STORE_CATEGORY_CHANNEL: alati
        NEXT_PUBLIC_DEFAULT_REGION: dk
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://alati.77.42.72.66.nip.io}
    container_name: medusa_storefront_tools
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_MEDUSA_BACKEND_URL=${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-http://medusajs-backend.77.42.72.66.nip.io}
      - NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-pk_test}
      - NEXT_PUBLIC_STORE_CATEGORY_CHANNEL=alati
      - NEXT_PUBLIC_DEFAULT_REGION=dk
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-http://alati.77.42.72.66.nip.io}
    env_file:
      - path: .env
        required: false
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
